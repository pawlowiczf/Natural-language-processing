repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^2-rnn-transformers/
      - id: ruff-format
        exclude: ^2-rnn-transformers/

  - repo: https://github.com/rubik/xenon
    rev: v0.9.0
    hooks:
      - id: xenon
        args: ["--max-absolute=B", "--max-modules=B", "--max-average=A"]
